name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: regenerate the demo from the fixture
        run: npm run demo:bake && npm run demo:web
      - name: the shipped demo matches the code
        run: git diff --exit-code --stat -- web
      - run: test -s web/index.html && test -s web/sample.html && test -s web/scan.json
